<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Access Key Admin · Matchestool.pro</title>
<style>
:root{color-scheme:dark;--bg:#050914;--panel:#0b1222;--line:#24354c;--gold:#f5b62e;--text:#e5edf7;--muted:#91a0b5;--red:#f87171;--green:#34d399}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif;padding:24px}.wrap{max-width:900px;margin:auto}h1{font-size:24px;margin:0 0 6px}.muted{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin:18px 0}label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}input{width:100%;background:#050914;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:12px;font:inherit}button{border:0;border-radius:8px;background:var(--gold);color:#1b1608;font-weight:700;padding:11px 15px;margin-top:12px;cursor:pointer}button.secondary{background:#1d2b40;color:var(--text)}button.danger{background:#4b2028;color:#fecaca}.grid{display:grid;grid-template-columns:2fr 1fr;gap:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.row small{display:block;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}.keybox{background:#071b17;border:1px solid #17634b;padding:14px;border-radius:8px;overflow-wrap:anywhere}.hidden{display:none}.status{margin-top:12px;color:var(--muted);white-space:pre-wrap}@media(max-width:600px){body{padding:14px}.grid{grid-template-columns:1fr}.row{align-items:flex-start}.row button{margin-top:0}}
</style></head><body><main class="wrap"><h1>Access Key Administration</h1><p class="muted">Issue individual keys, set expiry, and revoke access. This page requires your server-side admin key.</p>
<section class="panel" id="login"><label for="adminKey">Admin key</label><input id="adminKey" type="password" autocomplete="current-password" placeholder="Enter ACCESS_ADMIN_KEY"><button id="unlock">Open key manager</button><div class="status" id="loginStatus"></div></section>
<section class="panel hidden" id="manager"><h2>Issue a key</h2><div class="grid"><div><label for="label">User / key label</label><input id="label" maxlength="100" placeholder="e.g. Client 001"></div><div><label for="days">Expiry in days (blank = no expiry)</label><input id="days" type="number" min="1" max="3650" placeholder="30"></div></div><button id="create">Generate access key</button><div id="newKey" class="keybox hidden" style="margin-top:14px"></div><h2 style="margin-top:28px">Issued keys</h2><button class="secondary" id="refresh">Refresh list</button><div id="keys"></div><div class="status" id="status"></div></section></main>
<script>
(function(){'use strict';var adminKey='',el=function(id){return document.getElementById(id)};function say(s){el('status').textContent=s}
async function api(action,extra){var r=await fetch('/api/access',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':adminKey},body:JSON.stringify(Object.assign({action:action},extra||{}))});var d=await r.json().catch(function(){return{error:'Invalid server response'}});if(!r.ok)throw new Error((d.error||'Request failed')+(d.diagnostic?' ('+d.diagnostic+')':''));return d}
function date(v){return v?new Date(v).toLocaleString():'Never'}function escapeHtml(s){return String(s||'').replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]})}
async function load(){try{var d=await api('list');el('keys').innerHTML=d.keys.length?d.keys.map(function(k){var revoked=!!k.revoked_at,expired=k.expires_at&&Date.parse(k.expires_at)<=Date.now();return '<div class="row"><div><strong>'+escapeHtml(k.label)+'</strong><small>Created: '+escapeHtml(date(k.created_at))+' · Expires: '+escapeHtml(date(k.expires_at))+'</small><small style="color:'+(revoked||expired?'#f87171':'#34d399')+'">'+(revoked?'REVOKED':expired?'EXPIRED':'ACTIVE')+'</small></div>'+(!revoked&&!expired?'<button class="danger" data-revoke="'+escapeHtml(k.id)+'">Revoke</button>':'')+'</div>'}).join(''):'<p class="muted">No keys issued yet.</p>';say('Key list updated.')}catch(e){say(e.message)}}
el('unlock').onclick=async function(){adminKey=el('adminKey').value.trim();try{await api('list');el('login').classList.add('hidden');el('manager').classList.remove('hidden');await load()}catch(e){adminKey='';el('loginStatus').textContent=e.message}};
el('create').onclick=async function(){el('newKey').classList.add('hidden');try{var d=await api('create',{label:el('label').value,days:el('days').value});el('newKey').textContent='Copy this key now. It will not be shown again: '+d.accessKey;el('newKey').classList.remove('hidden');el('label').value='';await load()}catch(e){say(e.message)}};
el('refresh').onclick=load;el('keys').addEventListener('click',async function(e){var id=e.target&&e.target.getAttribute('data-revoke');if(!id)return;if(!confirm('Revoke this key and all its active sessions?'))return;try{await api('revoke',{id:id});say('Key revoked. Existing sessions are invalidated.');await load()}catch(err){say(err.message)}});
}());
</script></body></html>
